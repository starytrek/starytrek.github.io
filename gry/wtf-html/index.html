l>','<body>'],1],['Największy nagłówek','<{{}}>Tytuł</{{}}>',['h6','h1','p'],1]];let n=0,sel=-1,passed=new Set;const el=id=>document.getElementById(id);function draw(){let t=topics[n];el('progress').textContent='Zadanie '+(n+1)+' / '+topics.length;el('title').textContent=t[0];el('question').textContent='Wybierz poprawny fragment kodu.';el('code').textContent=t[1].replaceAll('{{}}',sel<0?'???':t[2][sel]);el('choices').replaceChildren();t[2].forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.className=sel===i?'selected':'';b.onclick=()=>{sel=i;draw()};el('choices').append(b)});let p=el('preview');p.replaceChildren();let v=document.createElement('div');if(n===3||n===4||n===16){v.textContent=n===3&&sel===1?'🐈':n===4&&sel===1?'▧ Rudy kot':'▧';v.style.fontSize=n===3&&sel===1?'60px':'16px'}else{v.textContent=sel===t[3]?'✓ Efekt poprawny':'Podgląd: sprawdź kod';if(n===26&&sel===1)p.style.background='lightblue';else p.style.background='white';if(n===27&&sel===0)v.style.color='red'}p.append(v);el('score').textContent='Zaliczone: '+passed.size+' / '+topics.length}el('check').onclick=()=>{if(sel===topics[n][3]){passed.add(n);el('feedback').textContent='✓ Poprawnie!'}else el('feedback').textContent='✗ Spróbuj ponownie.';el('score').textContent='Zaliczone: '+passed.size+' / '+topics.length};el('hint').onclick=()=>el('feedback').textContent='Wskazówka: '+topics[n][0];el('next').onclick=()=>{n=(n+1)%topics.length;sel=-1;el('feedback').textContent='';draw()};draw();</script></html>
