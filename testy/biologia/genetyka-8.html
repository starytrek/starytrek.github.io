<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genetyka · Biologia · 8 klasa</title><link rel="stylesheet" href="../../assets/study.css"><style>body{margin:0;background:#f2f7f4;color:#183329;font:17px/1.55 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:25px 18px 60px}h1{font-size:clamp(30px,6vw,42px);line-height:1.2;margin:16px 0}h2{font-size:20px}.tag{color:#087a62;font-weight:750}.card{background:white;border:1px solid #cbded3;border-radius:15px;margin:20px 0;padding:23px}.opts{display:grid;gap:10px}.opt{font:inherit;text-align:left;background:#f5f9f6;border:1px solid #a9c6b6;color:#183329;border-radius:10px;padding:13px;cursor:pointer}.opt:disabled{cursor:default}.opt.good{background:#def5e7;border-color:#168151}.opt.bad{background:#fff0f0;border-color:#c43d4e}.opt:focus-visible,button:focus-visible{outline:3px solid #c47b00;outline-offset:3px}.feedback{background:#eff6f1;padding:15px;border-radius:10px;margin-top:14px}.toolbar{position:sticky;top:0;background:#f2f7f4ef;padding:13px;border-bottom:1px solid #cbded3;z-index:2;display:flex;justify-content:space-between;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{font:600 16px system-ui;padding:13px 17px;border:0;border-radius:9px;background:#087a62;color:white;cursor:pointer}#reset{background:#e0ebe5;color:#183329}#result{scroll-margin-top:70px}[hidden]{display:none!important}a{color:#087a62}.card small{color:#476e5b;font-size:14px}.feedback.wrong{background:#fff0f1;color:#a7192b;border-left:4px solid #bd2035}.feedback.right{color:#176742}h2{font-weight:600}</style></head><body><main><a class="study-button" href="../../index.html">Wróć do materiałów</a><p class="tag">Biologia · 8 klasa · trudność: średnia</p><h1>Genetyka</h1><p>20 pytań ABCD. Wybierz jedną odpowiedź. Po kliknięciu zobaczysz wyjaśnienie, a na końcu wynik.</p><div class="toolbar"><span id="counter">0 / 20 odpowiedzi</span><strong id="score">0 pkt</strong></div><div id="questions"></div><div class="actions"><button id="finish" type="button">Zakończ test</button><button id="reset" type="button">Zacznij od nowa</button></div><section id="result" class="card" hidden role="status"></section><p><small>Autorskie zadania. Materiał do powtórki: <a href="https://zpe.gov.pl/a/istota-dziedziczenia/DBetmw8cS">Istota dziedziczenia — ZPE</a>.</small></p></main><script>
const Q=[{"topic": "DNA i geny", "q": "Czym jest gen w szkolnym opisie dziedziczenia?", "opts": ["Odcinkiem DNA zawierającym informację potrzebną do wytworzenia określonego produktu, np. białka.", "Całą komórką, w której znajduje się jądro.", "Jednym aminokwasem budującym białko.", "Każdą cechą nabytą podczas życia."], "c": 0, "why": "Gen jest fragmentem DNA. Wiele genów zawiera informację o budowie białek, które wpływają na cechy organizmu. Gen nie jest samą cechą ani całą komórką."}, {"topic": "Budowa DNA", "q": "Fragment jednej nici DNA ma sekwencję A–T–G–C–C. Jaki fragment drugiej nici jest z nim komplementarny?", "opts": ["U–A–C–G–G", "T–A–C–G–G", "A–T–G–C–C", "T–A–G–C–C"], "c": 1, "why": "W DNA adenina (A) łączy się z tyminą (T), a guanina (G) z cytozyną (C). Dobieramy partnera do każdej zasady po kolei: T–A–C–G–G. U, czyli uracyl, występuje w RNA zamiast tyminy."}, {"topic": "Chromosomy", "q": "Chromosom po skopiowaniu DNA, przed rozdzieleniem chromatyd, składa się z:", "opts": ["Jednej chromatydy i jednej gamety.", "Czterech niezależnych chromosomów.", "Dwóch chromatyd siostrzanych połączonych w okolicy centromeru.", "Dwóch jąder komórkowych."], "c": 2, "why": "Po replikacji chromosom ma dwie chromatydy siostrzane, które zawierają kopie DNA. Dopóki są połączone, liczymy je jako jeden chromosom. Dopiero ich rozdzielenie daje oddzielne chromosomy."}, {"topic": "Liczba chromosomów", "q": "Typowa komórka ciała człowieka ma 46 chromosomów. Ile ma prawidłowa gameta człowieka?", "opts": ["46", "92", "12", "23"], "c": 3, "why": "Gamety, czyli plemniki i komórki jajowe, mają po jednym chromosomie z każdej pary — 23. Po połączeniu dwóch gamet zygota ma 46 chromosomów."}, {"topic": "Mitoza", "q": "Który proces jest bezpośrednio związany z mitozą?", "opts": ["Zwiększanie liczby komórek podczas wzrostu i gojenia ran.", "Zmniejszenie liczby chromosomów o połowę przy tworzeniu gamet.", "Połączenie plemnika z komórką jajową.", "Wymiana genów między rodzicami po narodzinach dziecka."], "c": 0, "why": "Mitoza daje dwie komórki potomne z taką samą liczbą chromosomów jak komórka wyjściowa. Umożliwia wzrost i odnowę tkanek. Redukcja liczby chromosomów zachodzi w mejozie, a łączenie gamet to zapłodnienie."}, {"topic": "Mejoza", "q": "Komórka mająca 12 chromosomów przechodzi pełną mejozę. Ile chromosomów ma każde z czterech powstałych jąder?", "opts": ["3", "6", "12", "24"], "c": 1, "why": "Mejoza obejmuje dwa podziały, ale DNA jest kopiowane tylko przed pierwszym. Liczba chromosomów zostaje zmniejszona o połowę: z 12 do 6. Drugi podział rozdziela chromatydy, nie zmniejsza tej liczby ponownie do 3."}, {"topic": "Mejoza i zapłodnienie", "q": "Dlaczego liczba chromosomów nie podwaja się w każdym kolejnym pokoleniu człowieka?", "opts": ["Komórka jajowa nie ma żadnych chromosomów.", "Zygota po zapłodnieniu ma zawsze tylko 23 chromosomy.", "Mejoza zmniejsza liczbę chromosomów w gametach do 23, a zapłodnienie przywraca 46.", "Mitoza usuwa wszystkie chromosomy ojca."], "c": 2, "why": "W gametach liczba chromosomów jest zredukowana: 23 w plemniku i 23 w komórce jajowej. Podczas zapłodnienia łączą się ich zestawy: 23 + 23 = 46. Dzięki temu liczba chromosomów pozostaje stała między pokoleniami."}, {"topic": "Genotyp i fenotyp", "q": "Dwie rośliny mają genotyp Aa, ale jedna jest niższa wskutek niedoboru wody. Co najlepiej wyjaśnia tę różnicę?", "opts": ["Niedobór wody zawsze zmienia genotyp Aa w aa.", "Fenotyp oznacza wyłącznie zestaw alleli.", "Rośliny o takim samym genotypie muszą zawsze mieć identyczny wygląd.", "Na fenotyp wpływają zarówno genotyp, jak i warunki środowiska."], "c": 3, "why": "Genotyp to informacja genetyczna, a fenotyp to cechy organizmu, np. wysokość. Na ich wykształcenie może wpływać środowisko. Niedobór wody może ograniczyć wzrost bez zmiany alleli Aa."}, {"topic": "Allele", "q": "Wskaż heterozygotę dla genu oznaczonego literą B.", "opts": ["Bb", "BB", "bb", "B"], "c": 0, "why": "Heterozygota ma dwa różne allele danego genu, tutaj B i b. BB i bb to homozygoty. Pojedyncza litera B może oznaczać allel w gamecie, ale nie pełny genotyp tej cechy w komórce diploidalnej."}, {"topic": "Gamety", "q": "Jakie allele badanego genu mogą znaleźć się w gametach osobnika Aa?", "opts": ["Wyłącznie aa.", "A albo a — każda gameta zawiera jeden z tych alleli.", "Zawsze jednocześnie A i a.", "Tylko A, ponieważ jest dominujący."], "c": 1, "why": "Podczas mejozy allele rozdzielają się do gamet. Dla osobnika Aa możliwe są gamety z A oraz gamety z a, zwykle z jednakowym prawdopodobieństwem. Dominacja nie usuwa allelu a z gamet."}, {"topic": "Krzyżówka Aa × Aa", "q": "U grochu allel A warunkuje żółte nasiona i dominuje całkowicie nad a, warunkującym zielone nasiona. Jakie jest prawdopodobieństwo zielonych nasion w krzyżówce Aa × Aa?", "opts": ["50%", "75%", "25%", "0%"], "c": 2, "why": "Każdy rodzic tworzy gamety A i a. Krzyżówka daje AA, Aa, Aa i aa. Zielone nasiona ma tylko aa, czyli jedna z czterech jednakowo prawdopodobnych kombinacji: 25%. To prawdopodobieństwo, a nie gwarantowany wynik w każdej grupie czterech nasion."}, {"topic": "Krzyżówka Aa × aa", "q": "Przy całkowitej dominacji A nad a krzyżujemy osobniki Aa i aa. Jakie jest prawdopodobieństwo cechy dominującej u potomstwa?", "opts": ["25%", "75%", "100%", "50%"], "c": 3, "why": "Osobnik Aa tworzy gamety A i a, a osobnik aa tylko a. Potomstwo może mieć Aa albo aa, z jednakowym prawdopodobieństwem. Cechę dominującą ma Aa, więc wynik to 50%."}, {"topic": "Krzyżówka AA × aa", "q": "Przy całkowitej dominacji A nad a jakie genotypy otrzyma potomstwo krzyżówki AA × aa?", "opts": ["Wszystkie osobniki będą Aa.", "Wszystkie osobniki będą AA.", "Połowa będzie AA, a połowa aa.", "Wszystkie osobniki będą aa."], "c": 0, "why": "Rodzic AA przekazuje zawsze A, a rodzic aa zawsze a. Każde potomstwo dostaje więc Aa i wykazuje cechę dominującą. Genotyp potomstwa nie jest identyczny z genotypem żadnego z tych rodziców."}, {"topic": "Wnioskowanie o genotypie", "q": "U pewnej rośliny fioletowe kwiaty (A) dominują całkowicie nad białymi (a). Dwie rośliny o fioletowych kwiatach mają potomstwo o białych kwiatach. Jakie genotypy mają rodzice?", "opts": ["aa i aa", "Aa i Aa", "AA i AA", "AA i Aa"], "c": 1, "why": "Białe potomstwo ma aa, więc musiało otrzymać a od każdego rodzica. Rodzice mają fioletowe kwiaty, czyli także A. Oba warunki spełnia Aa: każdy rodzic jest heterozygotą."}, {"topic": "Dominacja alleli", "q": "Które zdanie poprawnie opisuje allel dominujący przy dominacji zupełnej?", "opts": ["Zawsze daje organizmowi większą siłę.", "Nigdy nie występuje u homozygoty.", "Jego efekt ujawnia się w fenotypie heterozygoty.", "Zawsze występuje częściej w populacji niż allel recesywny."], "c": 2, "why": "Dominacja opisuje relację alleli: w heterozygocie ujawnia się efekt allelu dominującego. Nie oznacza większej częstości w populacji, przewagi fizycznej ani większej przydatności. Efekt ujawnia się też u homozygoty dominującej."}, {"topic": "Dziedziczenie płci", "q": "W typowym układzie chromosomów płci u człowieka matka ma XX, a ojciec XY. Jakie jest w szkolnym modelu prawdopodobieństwo potomstwa XY?", "opts": ["0%", "25%", "100%", "Około 50%"], "c": 3, "why": "Komórka jajowa przekazuje X. Plemnik może przekazać X albo Y: powstaje XX albo XY. Obie możliwości są w szkolnym modelu jednakowo prawdopodobne. Wyniki wcześniejszych narodzin nie wyznaczają płci kolejnego dziecka."}, {"topic": "Grupy krwi AB0", "q": "Matka ma genotyp Iᴬi (grupa A), a ojciec Iᴮi (grupa B). Jakie jest prawdopodobieństwo dziecka z grupą krwi 0?", "opts": ["25%", "0%", "50%", "100%"], "c": 0, "why": "Możliwe genotypy potomstwa to IᴬIᴮ (AB), Iᴬi (A), Iᴮi (B) i ii (0). Grupa 0 wymaga otrzymania allelu i od obu rodziców. Jedna z czterech jednakowo prawdopodobnych kombinacji daje ii, czyli 25%."}, {"topic": "Cecha sprzężona z płcią", "q": "W uproszczonym modelu hemofilia jest cechą recesywną sprzężoną z X. Matka jest zdrową nosicielką XᴴXʰ, a ojciec zdrowy XᴴY. Jaka część ich synów może mieć hemofilię?", "opts": ["100% synów", "50% synów", "0% synów", "25% synów"], "c": 1, "why": "Syn otrzymuje Y od ojca i jeden X od matki. Matka może przekazać Xᴴ albo Xʰ z jednakowym prawdopodobieństwem. Genotypy synów to więc XᴴY (zdrowy) lub XʰY (hemofilia). Wynik 50% dotyczy synów; wśród całego potomstwa chory syn to 25% w szkolnym modelu."}, {"topic": "Mutacje", "q": "Które zdanie o mutacjach jest prawdziwe?", "opts": ["Mutacją jest każda zmiana wyglądu bez zmiany materiału genetycznego.", "Mutacje pojawiają się wyłącznie wtedy, gdy organizm ich potrzebuje.", "Są zmianami materiału genetycznego; ich skutki mogą być różne, także obojętne.", "Każda mutacja musi natychmiast spowodować śmierć."], "c": 2, "why": "Mutacja to zmiana materiału genetycznego. Może dotyczyć sekwencji DNA, budowy lub liczby chromosomów. Jej skutek może być szkodliwy, obojętny albo korzystny — mutacje nie powstają celowo na potrzeby organizmu."}, {"topic": "Mutageny i dziedziczenie", "q": "Promieniowanie UV wywołało mutację wyłącznie w komórce skóry człowieka. Czy ta mutacja zostanie przekazana jego dzieciom podczas rozmnażania płciowego?", "opts": ["Tak, każda mutacja w dowolnej komórce trafia do gamet.", "Tak, ponieważ UV zawsze zmienia wszystkie komórki ciała.", "Nie, ponieważ promieniowanie UV nie może powodować mutacji.", "Nie, ponieważ nie zaszła w komórkach dających początek gametom."], "c": 3, "why": "UV jest czynnikiem mutagennym: może uszkadzać DNA. Dziecko otrzymuje jednak materiał genetyczny z gamet, a nie z komórek skóry rodzica. Mutacja ograniczona do komórki skóry nie jest w ten sposób dziedziczona."}];let chosen=Array(Q.length).fill(null);
function render(){const root=document.getElementById('questions');root.replaceChildren();Q.forEach((q,i)=>{const card=document.createElement('section');card.className='card';card.innerHTML='<small>PYTANIE '+(i+1)+' / 20 · '+q.topic+'</small><h2>'+q.q+'</h2><div class="opts"></div><div class="feedback" hidden aria-live="polite"></div>';q.opts.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent='ABCD'[j]+'. '+text;b.onclick=()=>select(i,j);card.querySelector('.opts').append(b)});root.append(card)});update()}
function select(i,j){if(chosen[i]!==null)return;chosen[i]=j;const card=document.querySelectorAll('#questions .card')[i],q=Q[i];card.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.c)b.classList.add('good');else if(k===j)b.classList.add('bad')});const f=card.querySelector('.feedback');f.hidden=false;f.className='feedback '+(j===q.c?'right':'wrong');f.textContent=(j===q.c?'Dobrze. ':'Błędnie. Poprawna odpowiedź: '+'ABCD'[q.c]+'. '+q.opts[q.c]+' ')+q.why;update()}
function update(){document.getElementById('counter').textContent=chosen.filter(x=>x!==null).length+' / 20 odpowiedzi';document.getElementById('score').textContent=Q.filter((q,i)=>chosen[i]===q.c).length+' pkt'}
document.getElementById('finish').onclick=()=>{const done=chosen.filter(x=>x!==null).length;const r=document.getElementById('result');r.hidden=false;r.textContent=done<Q.length?'Odpowiedz na wszystkie pytania. Pozostało: '+(Q.length-done)+'.':'Wynik: '+Q.filter((q,i)=>chosen[i]===q.c).length+' / 20. Przeczytaj wyjaśnienia przy błędnych odpowiedziach.';r.scrollIntoView({behavior:'smooth'})};document.getElementById('reset').onclick=()=>{chosen.fill(null);render();document.getElementById('result').hidden=true};render();
</script></body><script src="../../assets/study.js"></script><script>Study.attach({testId:"genetyka8-v1",total:Q.length,root:"#questions",finish:"#finish",reset:"#reset",answers:()=>chosen.map((v,i)=>({no:i+1,selected:v===null?-1:v})).filter(x=>x.selected>=0),restore:saved=>{Object.entries(saved).forEach(([no,v])=>{if(v>=0)select(Number(no)-1,v)})},canFinish:()=>chosen.every(v=>v!==null)});</script></html>
