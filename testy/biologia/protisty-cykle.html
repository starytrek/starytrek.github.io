</style><main><nav style="margin-bottom:16px"><a href="../../index.html">← NaukoGramy · materiały</a></nav><header><div class="eyebrow">BIOLOGIA ROZSZERZONA · 2 LO</div><h1>Protisty — druga grupa</h1><div class="muted">15 zadań · odpowiedzi otwarte i schematy · zestawy A i B</div></header><div id="app"></div></main><dialog id="confirm"><h2>Zakończyć test?</h2><p id="confirm-text"></p><div class="nav"><button id="cancel">Wróć do pytań</button><button class="primary" id="accept">Pokaż wynik</button></div></dialog><script>
const BANK=[{"id": "1", "topic": "Osmoregulacja", "variant": 0, "prompt": "Pantofelek żyje w wodzie słodkiej. Które wyjaśnienie łączy jego budowę z tym środowiskiem?", "options": ["Woda napływa osmotycznie, a wodniczki tętniące usuwają jej nadmiar.", "Woda odpływa osmotycznie, a wodniczki tętniące uzupełniają jej brak.", "Chloroplasty produkują cukry potrzebne do usuwania wody.", "Ściana komórkowa zapobiega napływowi wody do komórki."], "correct": "Woda napływa osmotycznie, a wodniczki tętniące usuwają jej nadmiar.", "ex": "Słodka woda jest zwykle hipotoniczna względem wnętrza pantofelka. Woda napływa przez osmozę; wodniczki tętniące usuwają jej nadmiar i chronią komórkę przed pęknięciem. Pantofelek nie ma chloroplastów ani ściany komórkowej.", "hint": "Porównaj stężenie substancji rozpuszczonych wewnątrz komórki i w słodkiej wodzie.", "fig": ""}, {"id": "2", "topic": "Osmoregulacja", "variant": 1, "prompt": "Pantofelka przeniesiono do środowiska izotonicznego. Jak zmieni się potrzeba pracy wodniczek tętniących?", "options": ["Zmniejszy się, bo nie będzie stałego napływu nadmiaru wody.", "Zwiększy się, bo woda będzie napływać szybciej.", "Wodniczki zaczną produkować wodę w fotosyntezie.", "Wodniczki przejmą trawienie pobranych bakterii."], "correct": "Zmniejszy się, bo nie będzie stałego napływu nadmiaru wody.", "ex": "W środowisku izotonicznym nie ma stałego osmotycznego napływu nadmiaru wody. Potrzeba jej usuwania maleje. Wodniczki pokarmowe i tętniące pełnią różne funkcje.", "hint": "Izotoniczne oznacza podobne stężenia osmotycznie czynne po obu stronach błony.", "fig": ""}, {"id": "3", "topic": "Pellikula i pokarm", "variant": 0, "prompt": "Dlaczego pantofelek nie pobiera stałych cząstek pokarmu w dowolnym miejscu powierzchni?", "options": ["Pellikula ogranicza odkształcanie powierzchni; pokarm trafia do komórki przez cytostom.", "Ściana z chityny uniemożliwia powstawanie wodniczek pokarmowych.", "Chloroplasty wymagają pobierania pokarmu wyłącznie przez wić.", "Makronukleus zamyka błonę dla wszystkich cząstek."], "correct": "Pellikula ogranicza odkształcanie powierzchni; pokarm trafia do komórki przez cytostom.", "ex": "Pellikula utrzymuje określony kształt pantofelka i ogranicza odkształcanie jego powierzchni. Pobieranie pokarmu jest zlokalizowane w obrębie cytostomu, skąd trafia on do wodniczek pokarmowych.", "hint": "Pantofelek ma stały kształt, a ameba może tworzyć nibynóżki.", "fig": ""}, {"id": "4", "topic": "Pellikula i pokarm", "variant": 1, "prompt": "Uszkodzenie rzęsek kierujących bakterie do cytostomu utrudnia pantofelkowi przede wszystkim…", "options": ["Pobieranie cząstek pokarmu i tworzenie wodniczek pokarmowych.", "Wytwarzanie tlenu w chloroplastach.", "Redukcję liczby chromosomów w sporoficie.", "Usuwanie wody przez ścianę komórkową."], "correct": "Pobieranie cząstek pokarmu i tworzenie wodniczek pokarmowych.", "ex": "Rzęski w okolicy aparatu gębowego kierują cząstki do cytostomu. Ich uszkodzenie utrudnia odżywianie, a nie fotosyntezę czy osmoregulację.", "hint": "Zwróć uwagę na funkcję struktur znajdujących się przy cytostomie.", "fig": ""}, {"id": "5", "topic": "Protisty zwierzęce", "variant": 0, "prompt": "Która para cech upodabnia protisty zwierzęce do zwierząt?", "options": ["Cudzożywność i brak ściany komórkowej.", "Samożywność i obecność chloroplastów.", "Brak jądra i obecność mureiny.", "Obecność chitynowej ściany i trawienie zewnętrzne."], "correct": "Cudzożywność i brak ściany komórkowej.", "ex": "Protisty zwierzęce są heterotrofami i nie mają ściany komórkowej. Mają jądro, ponieważ są eukariontami. Obecność lizosomów sama nie rozstrzyga o podobieństwie wyłącznie do zwierząt.", "hint": "Szukaj jednej cechy odżywiania i jednej cechy osłony komórki.", "fig": ""}, {"id": "6", "topic": "Protisty zwierzęce", "variant": 1, "prompt": "Nieznany protist ma jądro, pobiera bakterie przez fagocytozę i nie ma ściany komórkowej. W szkolnym podziale najbardziej przypomina…", "options": ["Protisty zwierzęce.", "Protisty roślinopodobne fotosyntetyzujące.", "Bakterie chemoautotroficzne.", "Rośliny lądowe o ścianie celulozowej."], "correct": "Protisty zwierzęce.", "ex": "Fagocytoza, cudzożywność i brak ściany komórkowej odpowiadają protistom zwierzęcym. Jądro wyklucza bakterie.", "hint": "Jądro odróżnia eukarionty od prokariontów.", "fig": ""}, {"id": "7", "topic": "Miksotrofizm", "variant": 0, "prompt": "Euglena ma światło, a potem trafia do ciemności z dostępnymi związkami organicznymi. Co wyjaśnia jej miksotrofizm?", "options": ["Może fotosyntetyzować, a w innych warunkach korzystać z gotowych związków organicznych.", "W świetle oddycha, a w ciemności przestaje prowadzić metabolizm.", "W ciemności zamienia mitochondria w chloroplasty.", "Zawsze wymaga pochłaniania innych komórek przez fagocytozę."], "correct": "Może fotosyntetyzować, a w innych warunkach korzystać z gotowych związków organicznych.", "ex": "Miksotrofizm oznacza możliwość łączenia autotrofii i heterotrofii. Euglena może fotosyntetyzować w świetle, a przy dostępności odpowiednich związków organicznych korzystać z nich heterotroficznie. Oddycha także w świetle.", "hint": "Odżywianie i oddychanie to różne procesy.", "fig": ""}, {"id": "8", "topic": "Miksotrofizm", "variant": 1, "prompt": "Który wynik doświadczenia potwierdza miksotrofizm eugleny?", "options": ["W świetle wykorzystuje CO₂, a bez światła rośnie przy dostępie do odpowiednich związków organicznych.", "Bez światła wytwarza tlen z wody, a w świetle nie prowadzi fotosyntezy.", "W obu warunkach pobiera wyłącznie gotowe związki organiczne.", "W obu warunkach nie pobiera węgla ani nie produkuje biomasy."], "correct": "W świetle wykorzystuje CO₂, a bez światła rośnie przy dostępie do odpowiednich związków organicznych.", "ex": "Wykorzystanie CO₂ przy fotosyntezie wskazuje na autotrofię. Wzrost bez światła dzięki gotowym związkom organicznym wskazuje na heterotrofię. Razem świadczą o miksotrofizmie.", "hint": "Potrzebujesz dowodu na dwa różne źródła węgla.", "fig": ""}, {"id": "9", "topic": "Rozmnażanie bezpłciowe", "variant": 0, "prompt": "Który zestaw zawiera sposoby rozmnażania bezpłciowego spotykane u protistów?", "options": ["Podział komórki, fragmentacja plechy, wytwarzanie zarodników bezpłciowych.", "Zapłodnienie, oogamia, połączenie gamet.", "Koniugacja, zapłodnienie, powstawanie zygoty.", "Transkrypcja, translacja, replikacja DNA."], "correct": "Podział komórki, fragmentacja plechy, wytwarzanie zarodników bezpłciowych.", "ex": "Protisty mogą rozmnażać się bezpłciowo przez podział komórki, fragmentację plechy i zarodniki bezpłciowe. Mitoza jest podziałem jądra, a nie pełną nazwą każdego sposobu rozmnażania organizmu.", "hint": "Odróżnij proces zachodzący w jądrze od sposobu powstania nowego osobnika.", "fig": ""}, {"id": "10", "topic": "Rozmnażanie bezpłciowe", "variant": 1, "prompt": "Fragment plechy protista odrywa się i rozwija w samodzielny organizm. Jak nazwać ten proces?", "options": ["Fragmentacja — rozmnażanie bezpłciowe.", "Oogamia — rozmnażanie płciowe.", "Koniugacja — wymiana jąder.", "Mejoza — redukcja liczby zestawów chromosomów."], "correct": "Fragmentacja — rozmnażanie bezpłciowe.", "ex": "Fragmentacja polega na rozwoju nowych osobników z fragmentów ciała. Nie wymaga łączenia gamet. Sama mejoza nie opisuje tego sposobu rozmnażania.", "hint": "Czy w opisie dochodzi do połączenia komórek płciowych?", "fig": ""}, {"id": "11", "topic": "Endosymbioza wtórna", "variant": 0, "prompt": "Jakie zdarzenie prowadziło do endosymbiozy wtórnej?", "options": ["Eukariont pochłonął fotosyntetyzującego eukarionta, który nie został strawiony.", "Bakteria pochłonęła wirusa, który utworzył jądro.", "Eukariont pochłonął sinicę bezpośrednio, tworząc pierwotny chloroplast.", "Dwie gamety połączyły się i od razu utworzyły cztery błony chloroplastu."], "correct": "Eukariont pochłonął fotosyntetyzującego eukarionta, który nie został strawiony.", "ex": "Endosymbioza wtórna dotyczy pochłonięcia eukarionta mającego już chloroplast. Pochłonięcie sinicy przez eukarionta odpowiada endosymbiozie pierwotnej.", "hint": "Słowo „wtórna” oznacza kolejny etap historii chloroplastu.", "fig": ""}, {"id": "12", "topic": "Endosymbioza wtórna", "variant": 1, "prompt": "Chloroplast protista otaczają trzy lub cztery błony. Która hipoteza najlepiej wyjaśnia tę cechę?", "options": ["Powstał po pochłonięciu fotosyntetyzującego eukarionta przez innego eukarionta.", "Powstał w wyniku połączenia czterech gamet.", "Jest mitochondrium, które zmieniło funkcję podczas mejozy.", "Jest bakterią, która wytworzyła trzy ściany z mureiny."], "correct": "Powstał po pochłonięciu fotosyntetyzującego eukarionta przez innego eukarionta.", "ex": "Dodatkowe błony chloroplastów wielu protistów są śladem endosymbiozy wtórnej. Pochłonięty partner był eukariontem posiadającym chloroplast.", "hint": "Uwzględnij osłony pochłoniętego partnera i jego chloroplastu.", "fig": ""}, {"id": "13", "topic": "Klasyfikacja", "variant": 0, "prompt": "Dlaczego protisty w tradycyjnym szkolnym podziale są grupą parafiletyczną?", "options": ["Obejmują wspólnego przodka, lecz nie wszystkich jego potomków.", "Obejmują wyłącznie organizmy bez wspólnego przodka.", "Obejmują wspólnego przodka i wszystkich jego potomków.", "Każdy protist jest jednokomórkowy i ma identyczny genom."], "correct": "Obejmują wspólnego przodka, lecz nie wszystkich jego potomków.", "ex": "Grupa parafiletyczna pomija część potomków wspólnego przodka. Tradycyjne protisty nie obejmują m.in. roślin, grzybów i zwierząt. Monofiletyczna grupa obejmuje wszystkich potomków.", "hint": "Przedrostek „para” przypomina o pominięciu części potomków.", "fig": ""}, {"id": "14", "topic": "Klasyfikacja", "variant": 1, "prompt": "Ze wspólnej linii eukariontów wyodrębniono rośliny, grzyby i zwierzęta, a resztę nazwano protistami. Jaki jest problem tego podziału?", "options": ["Grupa protistów nie obejmuje wszystkich potomków jej wspólnego przodka.", "Protisty przestały mieć jądra komórkowe.", "Wszystkie protisty stały się prokariontami.", "Wszystkie grupy mają identyczną budowę i sposób odżywiania."], "correct": "Grupa protistów nie obejmuje wszystkich potomków jej wspólnego przodka.", "ex": "Wyłączenie części potomków wspólnego przodka powoduje parafiletyczność tradycyjnej grupy protistów. Podział taksonomiczny nie zmienia budowy organizmów.", "hint": "Sprawdź kompletność grupy na drzewie pokrewieństwa.", "fig": ""}, {"id": "15", "topic": "Protisty roślinopodobne", "variant": 0, "prompt": "Co najpewniej upodabnia fotosyntetyzującego protista roślinopodobnego do komórki roślinnej?", "options": ["Obecność chloroplastów umożliwiających fotosyntezę.", "Brak jądra komórkowego.", "Obecność ściany z mureiny.", "Odżywianie wyłącznie przez fagocytozę."], "correct": "Obecność chloroplastów umożliwiających fotosyntezę.", "ex": "Chloroplasty i fotosynteza stanowią kluczowe podobieństwo. Wiele takich protistów ma ścianę, ale nie wszystkie. Skrobia nie jest uniwersalnym materiałem zapasowym wszystkich protistów roślinopodobnych.", "hint": "Wybierz cechę związaną z wykorzystywaniem energii światła.", "fig": ""}, {"id": "16", "topic": "Protisty roślinopodobne", "variant": 1, "prompt": "Uczeń twierdzi: „Każdy protist roślinopodobny magazynuje skrobię, więc to roślina”. Która poprawka jest trafna?", "options": ["Materiały zapasowe są zróżnicowane, a podobieństwo nie oznacza przynależności do roślin.", "Wszystkie protisty magazynują tylko glikogen.", "Protisty fotosyntetyzujące nie mają chloroplastów.", "Obecność skrobi wyklucza fotosyntezę."], "correct": "Materiały zapasowe są zróżnicowane, a podobieństwo nie oznacza przynależności do roślin.", "ex": "Protisty fotosyntetyzujące mają różne materiały zapasowe, np. euglena paramylon. Sama wspólna cecha nie wystarcza do przypisania organizmu do roślin.", "hint": "Nie przenoś cechy części gatunków na całą zróżnicowaną grupę.", "fig": ""}, {"id": "17", "topic": "Typy gamet", "variant": 0, "prompt": "Gamety są podobnej wielkości i obie ruchliwe. Jaki to typ łączenia gamet?", "options": ["Izogamia.", "Anizogamia.", "Oogamia.", "Fragmentacja."], "correct": "Izogamia.", "ex": "Izogamia obejmuje podobne gamety. W anizogamii gamety różnią się wielkością, a w szkolnym ujęciu obie są ruchliwe. W oogamii komórka jajowa jest duża i nieruchliwa.", "hint": "Porównaj wielkość i zdolność ruchu obu gamet.", "fig": ""}, {"id": "18", "topic": "Typy gamet", "variant": 1, "prompt": "Na schemacie komórka jajowa jest duża i nieruchliwa, a plemnik mały i ruchliwy. Jest to…", "options": ["Oogamia.", "Izogamia.", "Anizogamia z obiema gametami ruchliwymi.", "Podział komórki."], "correct": "Oogamia.", "ex": "Oogamia jest szczególnym zróżnicowaniem gamet: duża nieruchliwa komórka jajowa i mały ruchliwy plemnik. Takie gamety występują u listownicy.", "hint": "Liczą się jednocześnie wielkość i ruchliwość gamet.", "fig": "kelp"}, {"id": "19", "topic": "Malaria: mejoza", "variant": 0, "prompt": "Na schemacie zarodźca malarii mejoza występuje po powstaniu zygoty. Jaki jest to typ mejozy i dlaczego?", "options": ["Postgamiczna — redukcja 2n → n następuje po zapłodnieniu.", "Pregamiczna — gamety powstają z diploidalnego organizmu przez mejozę.", "Pośrednia — sporofit tworzy zarodniki dla wielokomórkowego gametofitu.", "Mitoza — zapłodnienie nie zmienia liczby zestawów chromosomów."], "correct": "Postgamiczna — redukcja 2n → n następuje po zapłodnieniu.", "ex": "U zarodźca mejoza jest postgamiczna: następuje po zapłodnieniu, w cyklu obejmującym zygotę 2n. Nie ma wielokomórkowej przemiany pokoleń jak u listownicy.", "hint": "Uzasadnienie musi wskazać położenie mejozy względem zapłodnienia.", "fig": "malaria"}, {"id": "20", "topic": "Malaria: mejoza", "variant": 1, "prompt": "W cyklu zarodźca gamety n łączą się w zygotę 2n. Jaki proces przywraca fazę haploidalną?", "options": ["Mejoza po zapłodnieniu, w organizmie komara.", "Mitoza zygoty w erytrocycie człowieka.", "Zapłodnienie w komórce wątroby.", "Fragmentacja diploidalnego gametofitu."], "correct": "Mejoza po zapłodnieniu, w organizmie komara.", "ex": "Zapłodnienie daje 2n, a mejoza przywraca n. Etapy płciowe i mejoza w cyklu zarodźca zachodzą w komarze; u człowieka pasożyt namnaża się bezpłciowo.", "hint": "Który podział zmniejsza liczbę zestawów chromosomów?", "fig": "malaria"}, {"id": "21", "topic": "Malaria: żywiciele", "variant": 0, "prompt": "Dlaczego człowiek jest żywicielem pośrednim zarodźca malarii?", "options": ["W człowieku pasożyt rozmnaża się bezpłciowo; rozmnażanie płciowe zachodzi w komarze.", "Człowiek jest większy od komara i ma cięższe objawy.", "Gamety łączą się w wątrobie człowieka.", "Komar tylko mechanicznie przenosi pasożyta, który nie rozwija się w jego ciele."], "correct": "W człowieku pasożyt rozmnaża się bezpłciowo; rozmnażanie płciowe zachodzi w komarze.", "ex": "O rodzaju żywiciela decyduje rodzaj rozmnażania pasożyta. U człowieka zachodzi namnażanie bezpłciowe, a w komarze rozmnażanie płciowe. Komar jest żywicielem ostatecznym.", "hint": "Nie uzasadniaj rodzaju żywiciela nasileniem choroby.", "fig": "malaria"}, {"id": "22", "topic": "Malaria: żywiciele", "variant": 1, "prompt": "Która kolejność etapów po zakażeniu człowieka odpowiada schematowi?", "options": ["Wątroba → erytrocyty → gametocyty pobierane przez komara.", "Erytrocyty → zapłodnienie w człowieku → wątroba.", "Gamety w skórze → zygota w wątrobie → komar.", "Komar → chloroplasty człowieka → gametofit."], "correct": "Wątroba → erytrocyty → gametocyty pobierane przez komara.", "ex": "Sporozoity trafiają do wątroby. Powstałe merozoity zakażają erytrocyty. Część pasożytów tworzy gametocyty, które pobiera komar. Gametocyty to nie zygoty.", "hint": "Odczytaj kierunek strzałek w części „człowiek”.", "fig": "malaria"}, {"id": "23", "topic": "Toksoplazmoza: cykl", "variant": 0, "prompt": "Toxoplasma gondii rozmnaża się płciowo u kotowatych. Które uzasadnienie dotyczące człowieka jest poprawne?", "options": ["Nie powstają u niego gamety pasożyta, ponieważ
