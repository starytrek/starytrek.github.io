<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizmy · Biologia · 5 klasa</title><link rel="stylesheet" href="../../assets/study.css"><style>body{margin:0;background:#f2f7f4;color:#183329;font:17px/1.55 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:25px 18px 60px}h1{font-size:clamp(30px,6vw,42px);line-height:1.2;margin:16px 0}h2{font-size:20px}.tag{color:#087a62;font-weight:750}.card{background:white;border:1px solid #cbded3;border-radius:15px;margin:20px 0;padding:23px}.opts{display:grid;gap:10px}.opt{font:inherit;text-align:left;background:#f5f9f6;border:1px solid #a9c6b6;color:#183329;border-radius:10px;padding:13px;cursor:pointer}.opt:disabled{cursor:default}.opt.good{background:#def5e7;border-color:#168151}.opt.bad{background:#fff0f0;border-color:#c43d4e}.opt:focus-visible,button:focus-visible{outline:3px solid #c47b00;outline-offset:3px}.feedback{background:#eff6f1;padding:15px;border-radius:10px;margin-top:14px}.toolbar{position:sticky;top:0;background:#f2f7f4ef;padding:13px;border-bottom:1px solid #cbded3;z-index:2;display:flex;justify-content:space-between;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{font:600 16px system-ui;padding:13px 17px;border:0;border-radius:9px;background:#087a62;color:white;cursor:pointer}#reset{background:#e0ebe5;color:#183329}#result{scroll-margin-top:70px}[hidden]{display:none!important}a{color:#087a62}.card small{color:#476e5b;font-size:14px}</style></head><body><main><a class="study-button" href="../../index.html">Wróć do materiałów</a><p class="tag">Biologia · 5 klasa</p><h1>Organizmy</h1><p>10 pytań ABCD. Wybierz jedną odpowiedź. Po kliknięciu zobaczysz wyjaśnienie, a na końcu wynik.</p><div class="toolbar"><span id="counter">0 / 10 odpowiedzi</span><strong id="score">0 pkt</strong></div><div id="questions"></div><div class="actions"><button id="finish" type="button">Zakończ test</button><button id="reset" type="button">Zacznij od nowa</button></div><section id="result" class="card" hidden role="status"></section></main><script>
const Q=[
{topic:'Czynności życiowe',q:'Samochód porusza się i zużywa paliwo. Dlaczego mimo to nie jest organizmem?',opts:['Każdy organizm musi mieć liście.','Ruch i zużywanie energii nie wystarczą: samochód nie ma budowy komórkowej ani pełnego zestawu czynności życiowych.','Organizmy nigdy się nie poruszają.','Organizmem jest każdy przedmiot, który się porusza.'],c:1,why:'Organizmy mają budowę komórkową i wykonują czynności życiowe. Sam ruch nie oznacza, że coś żyje.'},
{topic:'Budowa komórki',q:'Która struktura otacza każdą komórkę i reguluje, jakie substancje dostają się do niej oraz z niej wydostają?',opts:['Błona komórkowa.','Chloroplast.','Ściana komórkowa.','Jądro komórkowe.'],c:0,why:'Błona komórkowa oddziela wnętrze komórki od otoczenia i kontroluje wymianę substancji. Nie każda komórka ma ścianę lub jądro.'},
{topic:'Budowa komórki',q:'W typowej komórce liścia występują chloroplasty. Jaką pełnią funkcję?',opts:['Kierują ruchem całego zwierzęcia.','Usuwają wszystkie substancje z komórki.','Umożliwiają fotosyntezę dzięki zawartemu w nich chlorofilowi.','Zastępują błonę komórkową.'],c:2,why:'W chloroplastach zachodzi fotosynteza. Chlorofil pochłania energię światła potrzebną do tego procesu.'},
{topic:'Jednokomórkowe i wielokomórkowe',q:'Bakteria jest organizmem jednokomórkowym. Co to oznacza?',opts:['Ma tylko jedno jądro, ale wiele komórek.','Składa się z jednej komórki, która wykonuje czynności życiowe całego organizmu.','Nie ma żadnych komórek.','Zawsze żyje tylko jeden dzień.'],c:1,why:'Jednokomórkowy oznacza zbudowany z jednej komórki. U bakterii nie występuje jądro komórkowe.'},
{topic:'Samożywność i cudzożywność',q:'Która para poprawnie opisuje sposób odżywiania organizmów?',opts:['Dąb jest cudzożywny, a kot samożywny.','Dąb i kot wytwarzają pokarm dzięki fotosyntezie.','Kot wytwarza pokarm z wody i dwutlenku węgla.','Dąb jest samożywny, a kot cudzożywny.'],c:3,why:'Dąb wytwarza związki organiczne w fotosyntezie. Kot pobiera gotowy pokarm, dlatego jest cudzożywny.'},
{topic:'Fotosynteza',q:'Co roślina wykorzystuje podczas fotosyntezy do wytwarzania cukru?',opts:['Wodę i dwutlenek węgla oraz energię światła.','Tylko tlen, bez wody i światła.','Gotowe mięso oraz glebę.','Tylko składniki mineralne, bez energii.'],c:0,why:'Roślina wykorzystuje wodę i dwutlenek węgla. Energia światła umożliwia wytwarzanie cukru; wydziela się również tlen.'},
{topic:'Oddychanie',q:'Oddychanie komórkowe służy przede wszystkim do:',opts:['Zamiany każdej komórki w liść.','Wytwarzania pokarmu przy udziale światła.','Uwalniania energii z substancji pokarmowych.','Pobierania wyłącznie soli mineralnych.'],c:2,why:'Podczas oddychania komórkowego uwalniana jest energia potrzebna do czynności życiowych. Oddychanie komórkowe nie jest tym samym co wdech i wydech.'},
{topic:'Reagowanie na bodźce',q:'Roślina na parapecie wygina pęd w stronę okna. Jaką czynność życiową ilustruje ta obserwacja?',opts:['Rozmnażanie, bo powstają nasiona.','Reagowanie na bodziec, którym jest światło.','Wydalanie, bo pęd zmienia kierunek.','Brak czynności życiowych, bo rośliny na nic nie reagują.'],c:1,why:'Światło jest bodźcem. Wzrost pędu w jego kierunku pokazuje, że rośliny reagują na zmiany w otoczeniu.'},
{topic:'Wzrost i rozwój',q:'Który przykład najlepiej pokazuje rozwój, czyli zmiany w budowie i funkcjonowaniu organizmu?',opts:['Ołówek został wydłużony przez dołączenie gumki.','Kamień rozpadł się na dwie części.','Szklankę napełniono wodą.','Kijanka przekształciła się w żabę.'],c:3,why:'Kijanka zmienia budowę i sposób funkcjonowania, np. wyrastają jej kończyny. Rozwój nie oznacza tylko zwiększenia rozmiarów.'},
{topic:'Budowa organizmu',q:'Która kolejność prawidłowo przedstawia organizację budowy człowieka od prostszych elementów do bardziej złożonych?',opts:['Komórka → tkanka → narząd → układ narządów → organizm.','Organizm → komórka → narząd → tkanka → układ narządów.','Tkanka → komórka → organizm → narząd → układ narządów.','Narząd → tkanka → komórka → organizm → układ narządów.'],c:0,why:'Komórki tworzą tkanki, tkanki budują narządy, a współpracujące narządy tworzą układy narządów. Wszystkie układy są częścią organizmu.'}
];let chosen=Array(Q.length).fill(null);
function render(){const root=document.getElementById('questions');root.replaceChildren();Q.forEach((q,i)=>{const card=document.createElement('section');card.className='card';card.innerHTML='<small>PYTANIE '+(i+1)+' / 10 · '+q.topic+'</small><h2>'+q.q+'</h2><div class="opts"></div><div class="feedback" hidden aria-live="polite"></div>';q.opts.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent='ABCD'[j]+'. '+text;b.onclick=()=>select(i,j);card.querySelector('.opts').append(b)});root.append(card)});update()}
function select(i,j){if(chosen[i]!==null)return;chosen[i]=j;const card=document.querySelectorAll('#questions .card')[i],q=Q[i];card.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.c)b.classList.add('good');else if(k===j)b.classList.add('bad')});const f=card.querySelector('.feedback');f.hidden=false;f.textContent=(j===q.c?'Dobrze! ':'Poprawna odpowiedź: '+'ABCD'[q.c]+'. ')+q.why;update()}
function update(){document.getElementById('counter').textContent=chosen.filter(x=>x!==null).length+' / 10 odpowiedzi';document.getElementById('score').textContent=Q.filter((q,i)=>chosen[i]===q.c).length+' pkt'}
document.getElementById('finish').onclick=()=>{const done=chosen.filter(x=>x!==null).length;const r=document.getElementById('result');r.hidden=false;r.textContent=done<10?'Odpowiedz na wszystkie pytania. Pozostało: '+(10-done)+'.':'Wynik: '+Q.filter((q,i)=>chosen[i]===q.c).length+' / 10. Przeczytaj wyjaśnienia przy błędnych odpowiedziach.';r.scrollIntoView({behavior:'smooth'})};document.getElementById('reset').onclick=()=>{chosen.fill(null);render();document.getElementById('result').hidden=true};render();
</script></body><script src="../../assets/activity.js?v=1"></script><script src="../../assets/study.js"></script><script>Study.attach({testId:"organizmy5-v1",total:Q.length,root:"#questions",finish:"#finish",reset:"#reset",answers:()=>chosen.map((v,i)=>({no:i+1,selected:v===null?-1:v})).filter(x=>x.selected>=0),restore:saved=>{Object.entries(saved).forEach(([no,v])=>{if(v>=0)select(Number(no)-1,v)})},canFinish:()=>chosen.every(v=>v!==null)});</script></html>
