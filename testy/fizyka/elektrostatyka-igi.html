<div class="tag">Fizyka · 2 LO · dla Igi</div><h1>Elektrostatyka: Ładunek!</h1>
<p class="subtitle">18 pytań z podręcznika (s. 20–33) · kolejność i odpowiedzi mieszają się przy każdej próbie.</p>
<div class="hud"><strong id="counter">Pytanie 1/18</strong><strong id="score">0 punktów</strong></div>
<div class="track" aria-hidden="true"><div class="fill" id="progress"></div></div>
<section id="questions" class="test-card" aria-label="Test z elektrostatyki"><p id="q-topic" class="question-head"></p><h2 id="q-text"></h2><div id="options" class="options"></div><div id="explain" class="explain" hidden aria-live="polite"></div><div class="actions"><button type="button" id="next" class="btn primary" hidden>Następne pytanie →</button></div></section>
<div class="actions"><button id="finish" class="btn primary" hidden type="button">Zakończ i zobacz wynik</button><button id="reset" class="btn" type="button">Nowa próba</button></div>
<section id="result" class="test-card" hidden role="status"></section>
<p class="small">Wyjaśnienie pojawia się po odpowiedzi. Wyniki zapisują się na koncie wybranej osoby w NaukoGramy.</p>
</main>
<script>
'use strict';
const Q=[{"topic":"Elektryzowanie","q":"Co może przechodzić z jednego ciała na drugie podczas elektryzowania przez tarcie?","opts":["Protony znajdujące się w jądrach atomów","Elektrony","Neutrony","Całe jądra atomowe"],"c":1,"why":"W typowych doświadczeniach z tarciem przenoszone są elektrony. Protony pozostają w jądrach atomowych."},{"topic":"Znaki ładunków","q":"Co oznacza, że balonik został naelektryzowany ujemnie?","opts":["Ma nadmiar elektronów","Utracił wszystkie protony","Ma niedobór elektronów","Nie ma żadnego ładunku"],"c":0,"why":"Ujemny ładunek oznacza nadmiar elektronów w stosunku do protonów."},{"topic":"Oddziaływanie ładunków","q":"Co się stanie, jeśli zbliżymy dwie kulki naładowane dodatnio?","opts":["Zawsze się połączą","Przyciągną się","Odepchną się","Przestaną mieć ładunek"],"c":2,"why":"Ładunki jednoimienne się odpychają, a różnoimienne się przyciągają."},{"topic":"Przewodniki i izolatory","q":"Który zestaw zawiera odpowiednio przewodnik i izolator?","opts":["Szkło – miedź","Guma – aluminium","Miedź – sucha guma","Styropian – srebro"],"c":2,"why":"Miedź przewodzi prąd dzięki swobodnym elektronom. Sucha guma jest izolatorem."},{"topic":"Polaryzacja","q":"Dlaczego naelektryzowany balonik może przyciągać obojętne elektrycznie skrawki papieru?","opts":["Papier zawsze ma ładunek ujemny","Balonik silnie zwiększa grawitację","W papierze zachodzi polaryzacja ładunków","Każdy skrawek papieru staje się magnesem"],"c":2,"why":"Pole balonika nieznacznie przemieszcza ładunki związane w papierze. Bliższa część jest silniej przyciągana, choć cały papier pozostaje obojętny."},{"topic":"Indukcja elektrostatyczna","q":"Co dzieje się w metalowym, początkowo obojętnym przedmiocie, gdy zbliżamy do niego naładowany pręt bez dotykania?","opts":["Ładunki w metalu rozdzielają się","Wszystkie protony odpływają z metalu","Wszystkie elektrony znikają","Metal bezwzględnie uzyskuje nowy ładunek całkowity"],"c":0,"why":"Indukcja powoduje rozdział ładunków w przewodniku, lecz bez uziemienia nie musi zmienić jego ładunku całkowitego."},{"topic":"Elektryzowanie przez dotyk","q":"Dwie identyczne metalowe kulki: jedna ma ładunek +8 nC, druga jest obojętna. Po zetknięciu i rozdzieleniu ich ładunki wynoszą:","opts":["+8 nC i 0 nC","+4 nC i +4 nC","+8 nC i +8 nC","+4 nC i −4 nC"],"c":1,"why":"Ładunek całkowity jest zachowany (+8 nC). Identyczne kulki po zetknięciu dzielą go po równo: każda ma +4 nC."},{"topic":"Prawo Coulomba","q":"Odległość dwóch punktowych ładunków zwiększono dwukrotnie. Jak zmieniła się siła elektrostatyczna?","opts":["Wzrosła 2 razy","Zmalała 2 razy","Zmalała 4 razy","Nie zmieniła się"],"c":2,"why":"Prawo Coulomba: F = k·|q₁q₂|/r². Podwojenie odległości powoduje czterokrotne zmniejszenie siły."},{"topic":"Prawo Coulomba","q":"Odległość między dwoma ładunkami wzrosła z 2 cm do 6 cm. Ile razy zmalała siła oddziaływania?","opts":["3 razy","6 razy","9 razy","18 razy"],"c":2,"why":"Odległość wzrosła 3 razy, więc siła zmalała 3², czyli 9 razy."},{"topic":"Obliczanie siły","q":"Ładunki +1 nC i −2 nC są oddalone o 0,2 m. Ile wynosi wartość siły? Przyjmij k = 9·10⁹ N·m²/C².","opts":["4,5·10⁻⁷ N","4,5·10⁻⁵ N","9·10⁻³ N","2·10⁻⁷ N"],"c":0,"why":"F = 9·10⁹·(1·10⁻⁹·2·10⁻⁹)/(0,2)² = 4,5·10⁻⁷ N. Ładunki przyciągają się."},{"topic":"Ładunek i jednostki","q":"Jaką jednostkę ma ładunek elektryczny w układzie SI?","opts":["Niuton (N)","Kulomb (C)","Wolt (V)","Dżul (J)"],"c":1,"why":"Ładunek mierzymy w kulombach (C), a siłę w niutonach (N)."},{"topic":"Pole elektryczne","q":"W którym kierunku zwrócone są linie pola elektrycznego między ładunkiem dodatnim i ujemnym?","opts":["Od minusa do plusa","Od plusa do minusa","Prostopadle do obu ładunków","Zawsze w kierunku pionowym"],"c":1,"why":"Zwrot linii pola jest zgodny z siłą działającą na dodatni ładunek próbny: od plusa do minusa."},{"topic":"Natężenie pola","q":"Na rysunku w pewnym obszarze linie pola są gęściej rozmieszczone niż w innym. Oznacza to:","opts":["Silniejsze pole elektryczne","Słabsze pole elektryczne","Większą masę ładunków","Brak jakiejkolwiek siły"],"c":0,"why":"Większe zagęszczenie linii jest umownym oznaczeniem większego natężenia pola."},{"topic":"Pole jednorodne","q":"Gdzie w przybliżeniu można uzyskać jednorodne pole elektryczne?","opts":["Wokół punktowego ładunku dodatniego","Między dwiema dużymi równoległymi płytami o przeciwnych ładunkach, z dala od krawędzi","Przy dowolnym jednym baloniku","Tylko podczas burzy"],"c":1,"why":"Między równoległymi płytami pole jest w środkowym obszarze niemal jednorodne: linie są równoległe i równomiernie rozłożone."},{"topic":"Elektroskop","q":"Dlaczego listki naelektryzowanego elektroskopu rozchylają się?","opts":["Nabierają ładunków tego samego znaku i się odpychają","Zaczynają być magnetyczne","Tracą masę","Przyciąga je metalowa obudowa"],"c":0,"why":"Listki zyskują ładunki jednoimienne, dlatego działa między nimi siła odpychania."},{"topic":"Uziemienie","q":"Na czym polega uziemienie naelektryzowanego metalowego przedmiotu?","opts":["Na zamianie elektronów w protony","Na ogrzaniu go do wysokiej temperatury","Na umożliwieniu przepływu ładunku między przedmiotem a Ziemią","Na całkowitym usunięciu wszystkich elektronów"],"c":2,"why":"Uziemienie umożliwia przepływ ładunku do lub z Ziemi i często prowadzi do rozładowania przedmiotu."},{"topic":"Wyładowania atmosferyczne","q":"Czym jest piorun?","opts":["Nagłym wyładowaniem elektrycznym w atmosferze","Falą dźwiękową bez elektryczności","Strumieniem gorącego powietrza bez ładunków","Światłem odbitym od chmur"],"c":0,"why":"Piorun to gwałtowne wyładowanie elektryczne, które może zachodzić w chmurze, między chmurami albo między chmurą a ziemią."},{"topic":"Bezpieczeństwo podczas burzy","q":"Gdzie najlepiej schronić się podczas burzy?","opts":["Pod samotnym wysokim drzewem","W jeziorze, możliwie blisko brzegu","Na odkrytym wzniesieniu","W solidnym budynku lub zamkniętym samochodzie"],"c":3,"why":"Podczas burzy bezpieczniej schronić się w solidnym budynku lub zamkniętym samochodzie z metalowym nadwoziem. Unikamy drzew, otwartego terenu i wody."}];
const order=[],optionOrders=[],chosen=Array(Q.length).fill(null);let step=0,finished=false,runId=crypto.randomUUID();
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function initializeOrder(){order.splice(0,order.length,...shuffle(Q.map((_,i)=>i)));optionOrders.splice(0,optionOrders.length,...Q.map(q=>shuffle(q.opts.map((_,i)=>i))))}
function count(){return chosen.filter(v=>v!==null).length}
function updateHud(){document.getElementById('counter').textContent='Pytanie '+(Math.min(step+1,Q.length))+'/'+Q.length;document.getElementById('score').textContent=Q.filter((q,i)=>chosen[i]===q.c).length+' pkt';document.getElementById('progress').style.width=(count()/Q.length*100)+'%'}
function render(){const idx=order[step],q=Q[idx],answered=chosen[idx]!==null,options=document.getElementById('options');document.getElementById('q-topic').textContent=q.topic;document.getElementById('q-text').textContent=q.q;options.replaceChildren();
optionOrders[idx].forEach((original,pos)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[pos];const content=document.createElement('span');content.textContent=q.opts[original];b.append(letter,content);if(answered){b.disabled=true;if(original===q.c)b.classList.add('correct');else if(original===chosen[idx])b.classList.add('wrong')}else b.addEventListener('click',()=>select(idx,original));options.append(b)});
const exp=document.getElementById('explain');exp.hidden=!answered;exp.replaceChildren();if(answered){const strong=document.createElement('strong');strong.textContent=chosen[idx]===q.c?'Dobrze!':'Jeszcze nie. Poprawna odpowiedź: '+q.opts[q.c];const p=document.createElement('p');p.textContent=q.why;exp.append(strong,p)}
document.getElementById('next').hidden=!answered||step===Q.length-1;document.getElementById('finish').hidden=!answered||step!==Q.length-1||count()!==Q.length;
document.getElementById('questions').hidden=finished;updateHud()}
function select(i,j){if(chosen[i]!==null||finished)return;chosen[i]=j;render();window.quizTracker?.collect();try{const person=JSON.parse(localStorage.getItem('starytrek.person'));window.StudyActivity?.record(person,'electro:'+runId+':'+i)}catch{}}
document.getElementById('next').addEventListener('click',()=>{if(chosen[order[step]]===null||step>=Q.length-1)return;step++;render()});
document.getElementById('finish').addEventListener('click',()=>{if(!chosen.every(x=>x!==null))return;finished=true;document.getElementById('questions').hidden=true;document.getElementById('finish').hidden=true;const score=Q.filter((q,i)=>chosen[i]===q.c).length,r=document.getElementById('result');r.hidden=false;r.replaceChildren();const h=document.createElement('h2');h.textContent='Wynik: '+score+'/'+Q.length+' ('+Math.round(100*score/Q.length)+'%)';r.append(h);const intro=document.createElement('p');intro.textContent=score>=16?'Bardzo dobrze. Znasz niemal cały materiał.':score>=12?'Dobry wynik. Sprawdź zagadnienia do powtórki.':'Powtórz wyjaśnienia i spróbuj ponownie w innej kolejności.';r.append(intro);const missed=Q.map((q,i)=>({q,i})).filter(({q,i})=>chosen[i]!==q.c);if(missed.length){const title=document.createElement('strong');title.textContent='Zagadnienia do powtórki:';r.append(title);const list=document.createElement('ol');list.className='review';missed.forEach(({q})=>{const li=document.createElement('li');const strong=document.createElement('strong');strong.textContent=q.topic+' — '+q.q;li.append(strong,document.createElement('br'),document.createTextNode(q.why));list.append(li)});r.append(list)}r.scrollIntoView({behavior:'smooth',block:'nearest'})});
document.getElementById('reset').addEventListener('click',()=>{chosen.fill(null);initializeOrder();step=0;finished=false;runId=crypto.randomUUID();document.getElementById('result').hidden=true;document.getElementById('questions').hidden=false;render()});
initializeOrder();render();
</script>
<script src="../../assets/activity.js?v=3"></script><script src="../../assets/study.js"></script>
<script>window.quizTracker=Study.attach({testId:"elektrostatyka-iga-v1",total:Q.length,root:"#questions",finish:"#finish",reset:"#reset",answers:()=>chosen.map((v,i)=>({no:i+1,selected:v===null?-1:v})).filter(x=>x.selected>=0),restore:saved=>{for(const [n,v] of Object.entries(saved)){const i=Number(n)-1;if(i>=0&&i<Q.length&&v>=0)chosen[i]=v}const first=order.findIndex(i=>chosen[i]===null);step=first<0?Q.length-1:first;render()},canFinish:()=>chosen.every(x=>x!==null)});</script>
</body></html>
